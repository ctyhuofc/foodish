name: Foodish daily update

on:
  schedule:
    - cron: "17 10 * * *"   # ~4:17 am Edmonton: refresh deals
    - cron: "47 11 * * *"   # backup at ~5:47 am, only runs if the 4 am refresh didn't happen
    - cron: "23 13 * * *"   # second backup at ~7:23 am, same rule
    - cron: "45 21 * * *"   # ~3:45 pm Edmonton (2:45 pm in winter): send daily alerts
    - cron: "5 9 * * 0"     # Sunday ~3 am: re-discover restaurants from OpenStreetMap
  workflow_dispatch:
    inputs:
      task:
        description: "all (recommended), discover, scrape, notify, or pages (rebuild the /deals/ pages + health check only)"
        default: "all"

permissions:
  contents: write

concurrency: foodish

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_FTP: ${{ secrets.FTP_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r pipeline/requirements.txt
      - name: Browser for JavaScript-only sites (optional, set variable RENDER_JS=1)
        if: vars.RENDER_JS == '1'
        run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Discover restaurants (weekly)
        if: github.event.schedule == '5 9 * * 0' || inputs.task == 'discover' || inputs.task == 'all' || hashFiles('data/restaurants.json') == '' || github.event_name == 'schedule'
        run: |
          # weekly on Sundays, on request, or whenever the restaurant list is still empty
          if [ "${{ github.event.schedule }}" != "5 9 * * 0" ] && [ "${{ inputs.task }}" != "discover" ] && [ "${{ inputs.task }}" != "all" ] \
             && [ "$(tr -d '[:space:]' < data/restaurants.json)" != "[]" ]; then echo "Restaurant list exists; skipping."; exit 0; fi
          python pipeline/discover.py

      - name: Scrape deals (daily)
        if: github.event.schedule == '17 10 * * *' || github.event.schedule == '47 11 * * *' || github.event.schedule == '23 13 * * *' || github.event.schedule == '5 9 * * 0' || inputs.task == 'scrape' || inputs.task == 'all'
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RENDER_JS: ${{ vars.RENDER_JS }}
          MAX_LLM_CALLS: ${{ vars.MAX_LLM_CALLS || '400' }}
          MONTHLY_LLM_CALLS: ${{ vars.MONTHLY_LLM_CALLS || '6000' }}
        run: |
          # GitHub's own schedules are now backups: skip if today's refresh already happened
          # (the Cloudflare trigger in worker/cron starts it at exactly 4 am; GitHub's scheduler can run hours late)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "5 9 * * 0" ]; then
            AGE=$(python -c "import json,datetime as d;g=json.load(open('data/deals.json'))['generated_at'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g)).total_seconds()//3600))")
            if [ "$AGE" -lt 12 ]; then echo "Deals refreshed $AGE hours ago; skipping backup run."; exit 0; fi
          fi
          python pipeline/scrape.py

      - name: Build search-friendly deal pages (site/deals, sitemap.xml)
        if: always() && hashFiles('data/deals.json') != ''
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.foodish.ca' }}
        run: python pipeline/pages.py

      - name: Daily health check (shows on this run's Summary page)
        if: always() && hashFiles('data/cache/report.json') != ''
        run: python pipeline/health.py

      - name: Save updated data
        run: |
          git config user.name "foodish-bot"
          git config user.email "bot@foodish.ca"
          git add data site/data site/deals site/sitemap.xml site/robots.txt
          git diff --cached --quiet || git commit -m "Daily deals update $(date -u +%F)"
          git push

      - name: Upload deals file to your web host by FTP (optional)
        if: env.HAS_FTP == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/public_html/data' }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          SITE_DIR=$(dirname "$FTP_DIR")
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "mkdir -p -f $FTP_DIR; put -O $FTP_DIR data/deals.json; mirror -R --delete site/deals $SITE_DIR/deals; put -O $SITE_DIR site/sitemap.xml; put -O $SITE_DIR site/robots.txt; bye"

      - name: Send daily alerts
        if: github.event.schedule == '45 21 * * *' || inputs.task == 'notify' || inputs.task == 'all'
        env:
          API_URL: ${{ vars.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:hello@foodish.ca' }}
        run: python pipeline/notify.py

name: Foodish daily update

# What each schedule does is decided in ONE place: pipeline/plan.py (SCHEDULES). If you change a time
# here, change it there too; tests/test_plan.py checks they match. Times are UTC; Edmonton is UTC-6
# year-round since Nov 2026.
on:
  schedule:
    - cron: "17 10 * * *"   # 4:17 am Edmonton: refresh deals
    - cron: "47 11 * * *"   # 5:47 am backup: refreshes only if the 4 am run didn't happen
    - cron: "23 13 * * *"   # 7:23 am second backup, same rule
    - cron: "45 21 * * *"   # 3:45 pm: send daily alerts
    - cron: "5 9 * * 0"     # Sunday 3:05 am: re-discover restaurants from OpenStreetMap
  workflow_dispatch:
    inputs:
      task:
        description: "all (recommended), discover, scrape, notify, or pages (rebuild the /deals/ pages + health check only)"
        default: "all"

permissions:
  contents: write

concurrency: foodish

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # every city is read in turn; a new city's first read is the slow one
    env:
      HAS_FTP: ${{ secrets.FTP_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r pipeline/requirements.txt
      # On by default: about 450 sites (Tim Hortons, Starbucks, Pizza Pizza...) only show text in a browser.
      # To turn it off, set the GitHub variable RENDER_JS to 0.
      - name: Browser for JavaScript-only sites (on unless variable RENDER_JS=0)
        # (vars.RENDER_JS || '1') turns "not set" into '1': comparing an unset variable straight to '0'
        # counts as equal in GitHub's expressions (null becomes 0), which skipped this step.
        if: (vars.RENDER_JS || '1') != '0'
        run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Decide what this run does (pipeline/plan.py)
        id: plan
        env:
          PLAN_EVENT: ${{ github.event_name }}
          PLAN_SCHEDULE: ${{ github.event.schedule }}
          PLAN_TASK: ${{ inputs.task }}
        run: python pipeline/plan.py

      # Cities come from cities.json. The plan lists which ones need each job this run.
      - name: Discover restaurants (weekly, and for a newly added city)
        if: steps.plan.outputs.discover == 'true'
        run: python pipeline/discover.py ${{ steps.plan.outputs.discover_cities }}

      - name: Scrape deals (daily)
        # runs even if discovery failed for one city: the others still get fresh deals
        if: ${{ !cancelled() && steps.plan.outputs.scrape == 'true' }}
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RENDER_JS: ${{ vars.RENDER_JS || '1' }}
          MAX_LLM_CALLS: ${{ vars.MAX_LLM_CALLS || '400' }}
          MONTHLY_LLM_CALLS: ${{ vars.MONTHLY_LLM_CALLS || '12000' }}   # all cities together
        run: python pipeline/scrape.py ${{ steps.plan.outputs.scrape_cities }}

      - name: Build search-friendly deal pages (site/deals, site/<city>/deals, sitemap.xml)
        if: always() && hashFiles('data/deals.json') != ''
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.foodish.ca' }}
        run: python pipeline/pages.py

      - name: Daily health check (shows on this run's Summary page)
        if: always() && hashFiles('data/cache/report.json') != ''
        run: python pipeline/health.py

      - name: Save updated data
        # also when one city failed: every city that finished still gets published
        if: ${{ !cancelled() }}
        run: |
          git config user.name "foodish-bot"
          git config user.email "bot@foodish.ca"
          git add -A data site   # each city's data, plus the generated pages and sitemap under site/
          git diff --cached --quiet || git commit -m "Daily deals update $(date -u +%F)"
          # the repo may have changed while this ran (e.g. a merged pull request): replay on top, then push
          git pull --rebase -q origin "${GITHUB_REF_NAME:-main}" || true
          git push

      - name: Upload deals file to your web host by FTP (optional)
        if: env.HAS_FTP == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/public_html/data' }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          SITE_DIR=$(dirname "$FTP_DIR")
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "mkdir -p -f $FTP_DIR; put -O $FTP_DIR data/deals.json; mirror -R --delete site/deals $SITE_DIR/deals; put -O $SITE_DIR site/sitemap.xml; put -O $SITE_DIR site/robots.txt; bye"

      - name: Send daily alerts
        if: ${{ !cancelled() && steps.plan.outputs.notify == 'true' }}
        env:
          API_URL: ${{ vars.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:hello@foodish.ca' }}
        run: python pipeline/notify.py

      # Last on purpose: everything above has already saved and published. If the robot is broken
      # (e.g. the AI key stopped working), this turns the run red so GitHub emails you, instead of
      # a green tick on a run that quietly read nothing.
      - name: Fail the run if the robot is broken
        if: always() && steps.plan.outputs.scrape == 'true'
        run: python pipeline/health.py --gate ${{ steps.plan.outputs.scrape_cities }}

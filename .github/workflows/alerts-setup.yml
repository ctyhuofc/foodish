# Sets up (or updates) the alerts + deal-tips service on Cloudflare: worker/worker.js.
# Run it by hand: Actions → "Set up alerts service" → Run workflow. Safe to run again any time;
# it reuses the storage it made the first time and just redeploys the code.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard (Workers & Pages, right-hand side)
#   ADMIN_TOKEN            any long random password; lets the daily robot read alert sign-ups
name: Set up alerts service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The two Cloudflare secrets are read here only, cleaned, and handed to later steps.
      - name: Check the secrets are there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_TOKEN; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these in Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi
          # A space or line break copied along with a secret breaks it: strip them for the steps below.
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v=$(printf '%s' "${!s}" | tr -d '[:space:]'); echo "::add-mask::$v"; echo "$s=$v" >> "$GITHUB_ENV"
          done

      - name: Check the Cloudflare token and Account ID
        run: |
          say() { echo "::error title=$1::$2"; exit 1; }
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Token check: $(echo "$r" | jq -c '{success, status: .result.status, errors}')"
          [ "$(echo "$r" | jq -r .success)" = "true" ] || \
            say "Cloudflare token not accepted" "Check the CLOUDFLARE_API_TOKEN secret is the whole token. Cloudflare said: $(echo "$r" | jq -c .errors)"
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          echo "Account check: $(echo "$r" | jq -c '{success, name: .result.name, errors}')"
          [ "$(echo "$r" | jq -r .success)" = "true" ] || \
            say "Account ID not accepted" "Check the CLOUDFLARE_ACCOUNT_ID secret (32 letters and numbers). Cloudflare said: $(echo "$r" | jq -c .errors)"

      - name: Make the storage (first run only)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          cf() {  # Cloudflare API call -> $r; stops the run with Cloudflare's own reason if it fails
            r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" "$@")
            [ "$(echo "$r" | jq -r .success)" = "true" ] || { echo "::error title=Cloudflare refused::$(echo "$r" | jq -c .errors)"; exit 1; }
          }
          cf "$api?per_page=100"; list=$r
          for name in SUBS SUBMISSIONS; do
            title="foodish-$name"
            id=$(echo "$list" | jq -r --arg t "$title" '.result[] | select(.title == $t) | .id')
            if [ -z "$id" ]; then
              cf -X POST "$api" -d "{\"title\":\"$title\"}"; id=$(echo "$r" | jq -r .result.id)
              echo "Made $title"
            else
              echo "Reusing $title"
            fi
            sed -i "s/PASTE_${name}_ID_HERE/$id/" worker/wrangler.toml
          done
          if grep -q PASTE_ worker/wrangler.toml; then echo "::error::Couldn't fill in the storage ids"; exit 1; fi

      - name: Deploy
        working-directory: worker
        run: |
          npx -y wrangler@4 deploy
          printf '%s' "$ADMIN_TOKEN" | npx -y wrangler@4 secret put ADMIN_TOKEN

      - name: Check it answers
        run: |
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          sub=$(echo "$r" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "::error title=No workers.dev address yet::Open Workers & Pages in the Cloudflare dashboard once (pick a subdomain if asked), then run this again. Cloudflare said: $(echo "$r" | jq -c .errors)"
            exit 1
          fi
          url="https://foodish-api.$sub.workers.dev"
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ADMIN_TOKEN" "$url/submissions")
          echo "Service address: $url (sign-up list answered HTTP $code)"
          {
            echo "### Alerts service is up"
            echo ""
            echo "Address: **$url**"
            echo ""
            echo "Send this address to Claude so the app can start using it."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "::error::The service didn't answer properly (HTTP $code)"; exit 1; }
